apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-operator
  namespace: argocd

spec:
  project: homelab

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.97.1

    helm:
      valueFiles:
        - $values/values/observability/otel-operator-values.yaml

  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-operator
      targetRevision: 0.97.1
      helm:
        valueFiles:
          - $values/values/observability/otel-operator-values.yaml

    - repoURL: https://github.com/Harish-SN/K8s.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
