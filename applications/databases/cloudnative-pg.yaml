apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudnative-pg
  namespace: argocd

spec:
  project: homelab

  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.28.3
      helm:
        valueFiles:
          - $values/values/databases/cloudnative-pg-values.yaml

    - repoURL: https://github.com/Harish-SN/K8s.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true